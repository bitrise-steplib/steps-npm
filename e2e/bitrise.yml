format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  test_no_version_pinning:
    description: Step works without any version pinning (no npm_version input, no packageManager field)
    before_run:
    - _setup
    steps:
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: https://github.com/bitrise-samples/sample-apps-react-native-ios-and-android
        - branch: master
        - clone_into_dir: ./_tmp
    - path::./.:
        title: Run npm install without version pinning
        inputs:
        - workdir: ./_tmp
        - command: install

  test_packageManager_field:
    description: |
      packageManager field in package.json is enforced via corepack.
      The step runs `corepack enable npm` to install the npm shim, then npm install.
      The shim enforces the pinned version lazily on the first real npm invocation.
      We verify the version after npm install completes.
    before_run:
    - _setup
    steps:
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: https://github.com/bitrise-samples/sample-apps-react-native-ios-and-android
        - branch: master
        - clone_into_dir: ./_tmp
    - script:
        title: Add packageManager field to package.json
        inputs:
        - content: |
            #!/bin/bash
            set -ex
            node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./_tmp/package.json', 'utf8'));
            pkg.packageManager = 'npm@10.2.0';
            fs.writeFileSync('./_tmp/package.json', JSON.stringify(pkg, null, 2));
            "
            echo "Updated package.json:"
            cat ./_tmp/package.json
    - path::./.:
        title: Run npm install with packageManager field
        inputs:
        - workdir: ./_tmp
        - command: install
    - script:
        title: Verify npm version
        inputs:
        - content: |
            #!/bin/bash
            set -ex
            ACTUAL=$(cd ./_tmp && npm --version)
            EXPECTED="10.2.0"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "Expected npm $EXPECTED, got $ACTUAL"
              exit 1
            fi
            echo "npm version verified: $ACTUAL"

  test_explicit_npm_version:
    description: npm_version input pins the version via corepack enable npm + corepack prepare --activate
    before_run:
    - _setup
    steps:
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: https://github.com/bitrise-samples/sample-apps-react-native-ios-and-android
        - branch: master
        - clone_into_dir: ./_tmp
    - path::./.:
        title: Run npm install with explicit version
        inputs:
        - workdir: ./_tmp
        - npm_version: 10.2.0
        - command: install
    - script:
        title: Verify npm version
        inputs:
        - content: |
            #!/bin/bash
            set -ex
            ACTUAL=$(cd ./_tmp && npm --version)
            EXPECTED="10.2.0"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "Expected npm $EXPECTED, got $ACTUAL"
              exit 1
            fi
            echo "npm version verified: $ACTUAL"

  test_multiple_arguments:
    steps:
    - path::./.:
        title: Test with multiple arguments
        inputs:
        - workdir: ./test
        - command: run test-script --someswitch arg1 arg2 arg3

  _setup:
    steps:
    - script:
        title: Remove leftover _tmp folder
        inputs:
        - content: |
            #!/bin/env bash
            set -ex
            rm -rf ./_tmp
